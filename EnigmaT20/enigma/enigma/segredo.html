<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heart.</title>
  <link rel="stylesheet" href="css/segredo.css">
</head>
<body>

  <!-- Cenário -->
  <div class="fundo" aria-hidden="true"></div>
  <div class="brilho" aria-hidden="true"></div>
  <div class="veu" aria-hidden="true"></div>

  <main class="cena" id="cena">

    <!-- Coração (GIF original, sem alteração) -->
    <div class="coracao" aria-hidden="true">
      <img src="assets/images/heartbeat.gif" alt=""draggable="false">
    </div>

    <!-- Os cinco caracteres e os cinco campos são criados pelo script.js
         a partir de CONFIG.caracteres. -->
    <form class="enigma" id="enigma" autocomplete="off" novalidate>
      <div class="enigma__colunas" id="colunas" role="group" aria-label="Código"></div>

      <button class="enigma__botao" id="desvendar" type="submit">Desvendar</button>
      <p class="enigma__mensagem" id="mensagem" role="status" aria-live="polite"></p>
    </form>

  </main>

  <!-- Controle discreto de som -->
  <button class="som" id="som" type="button" aria-pressed="false" aria-label="Desativar som">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path class="som__alto" d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>
      <path class="som__onda" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path class="som__corte" d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <script src="js/segredo.js"></script>
</body>
</html>
